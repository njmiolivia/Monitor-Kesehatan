<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Health Monitor ✨</title>
  <!-- Google Font: Quicksand yang bulat dan imut -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #fff0f5; /* LavenderBlush / Soft Pink */
      --card-bg: #ffffff;
      --primary: #ffb7b2; /* Pastel Pink */
      --primary-hover: #ff9aa2;
      --secondary: #b5ead7; /* Pastel Mint */
      --accent: #c7ceea; /* Pastel Lilac */
      --text: #5c5555;
      --border: #f3e5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(#ffccd5 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(255, 183, 178, 0.35);
      border: 3px solid #ffdde1;
    }

    h2 {
      color: #d46a92;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 20px;
      background-color: #ffeaa7;
      color: #d68910;
      font-weight: 700;
      display: block;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .status-badge.connected {
      background-color: #d4edda;
      color: #155724;
    }

    .status-badge.simulated {
      background-color: #fff3cd;
      color: #856404;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: #8860d0;
      font-size: 0.9rem;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 16px;
      font-size: 14px;
      border: 2px solid #f3e5f5;
      border-radius: 16px;
      outline: none;
      background-color: #faf8fc;
      color: #4a4545;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #ffb7b2;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(255, 183, 178, 0.4);
    }

    input[readonly] {
      font-weight: bold;
      color: #5c5555;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-connect {
      background-color: #b5ead7;
      color: #2d6a4f;
      white-space: nowrap;
    }

    .btn-save {
      background-color: #ffb7b2;
      color: #8a3b35;
      flex: 2;
    }

    .btn-simulate {
      background-color: #ffdac1;
      color: #b45309;
      flex: 1.2;
    }

    .btn-download {
      background-color: #c7ceea;
      color: #364f6b;
      width: 100%;
      margin-top: 15px;
    }

    .table-container {
      margin-top: 20px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #f3e5f5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: center;
      font-size: 13px;
    }

    th {
      background-color: #f3e5f5;
      color: #8860d0;
      font-weight: 700;
    }

    td {
      background-color: #fff;
      border-top: 1px solid #f3e5f5;
    }

    .empty-row {
      color: #b0a8b9;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>✨ Monitoring Kesehatan 🌸</h2>
    <div id="statusBadge" class="status-badge">💤 Status: Terputus (Mode Siap)</div>

    <!-- Nama & Bluetooth -->
    <div class="form-group">
      <label>🎀 Nama Pasien / Subjek :</label>
      <div class="row">
        <input type="text" id="nama" placeholder="Ketik nama kamu di sini...">
        <button class="btn-connect" id="btnConnect" onclick="connectBluetooth()">🔗 Connect</button>
      </div>
    </div>

    <!-- HR & Temp -->
    <div class="row" style="margin-bottom: 16px;">
      <div class="form-group" style="flex:1; margin-bottom:0;">
        <label>💓 Heart Rate (HR) :</label>
        <input type="text" id="hr" readonly value="-- BPM">
      </div>
      <div class="form-group" style="flex:1; margin-bottom:0;">
        <label>🌡️ Temperatur :</label>
        <input type="text" id="temp" readonly value="-- °C">
      </div>
    </div>

    <!-- Tombol Aksi -->
    <div class="row">
      <button class="btn-save" onclick="saveData()">💾 Simpan Data</button>
      <button class="btn-simulate" id="btnSimulate" onclick="toggleSimulation()">🎲 Simulasi</button>
    </div>

    <!-- Tabel -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>HR</th>
            <th>Temperature</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="3" class="empty-row">Belum ada data tersimpan, yuk isi dulu! ✨</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Download -->
    <button class="btn-download" onclick="downloadCSV()">📥 Download Data (CSV)</button>
  </div>

  <script>
    let port;
    let reader;
    let savedRecords = [];
    let isSimulating = false;
    let simInterval = null;

    async function connectBluetooth() {
      if (isSimulating) stopSimulation();
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        updateStatus("✨ Terhubung ke Bluetooth!", "connected");
        document.getElementById('btnConnect').innerText = "✅ Connected";

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();
        readData();
      } catch (error) {
        alert("Bluetooth tidak tersambung. Mengaktifkan Mode Simulasi Praktikum otomatis! 🌸");
        startSimulation();
      }
    }

    async function readData() {
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) {
          buffer += value;
          let lines = buffer.split("\n");
          buffer = lines.pop();
          for (let line of lines) {
            line = line.trim();
            if (line.includes(",")) {
              let p = line.split(",");
              updateDisplay(p[0], p[1]);
            }
          }
        }
      }
    }

    function toggleSimulation() {
      if (isSimulating) stopSimulation();
      else startSimulation();
    }

    function startSimulation() {
      isSimulating = true;
      updateStatus("🎨 Mode Simulasi Aktif (Praktikum)", "simulated");
      document.getElementById('btnSimulate').innerText = "🛑 Stop Simulasi";
      
      simInterval = setInterval(() => {
        let hr = Math.floor(Math.random() * (95 - 65 + 1)) + 65;
        let temp = (Math.random() * (37.4 - 36.1) + 36.1).toFixed(1);
        updateDisplay(hr, temp);
      }, 1500);
    }

    function stopSimulation() {
      isSimulating = false;
      clearInterval(simInterval);
      updateStatus("💤 Status: Terputus (Mode Siap)", "");
      document.getElementById('btnSimulate').innerText = "🎲 Simulasi";
    }

    function updateDisplay(hr, temp) {
      document.getElementById('hr').value = hr + " BPM";
      document.getElementById('temp').value = temp + " °C";
    }

    function updateStatus(text, className) {
      const badge = document.getElementById('statusBadge');
      badge.innerText = text;
      badge.className = "status-badge " + className;
    }

    function saveData() {
      let nama = document.getElementById('nama').value.trim();
      let hr = document.getElementById('hr').value;
      let temp = document.getElementById('temp').value;

      if (!nama) { alert("Isi nama dulu ya, kak! 🎀"); return; }
      if (hr === "-- BPM") { alert("Belum ada data sensor masuk! 💡"); return; }

      savedRecords.push({ nama, hr, temp });
      
      let tbody = document.getElementById('tableBody');
      if (savedRecords.length === 1) tbody.innerHTML = "";

      let tr = document.createElement('tr');
      tr.innerHTML = `<td><b>${nama}</b></td><td>${hr}</td><td>${temp}</td>`;
      tbody.appendChild(tr);
    }

    function downloadCSV() {
      if (savedRecords.length === 0) { alert("Belum ada data yang bisa di-download! 📥"); return; }
      let csv = "Nama,HR,Temperature\n";
      savedRecords.forEach(r => { csv += `"${r.nama}","${r.hr}","${r.temp}"\n`; });
      
      let blob = new Blob([csv], { type: 'text/csv' });
      let link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "data_kesehatan_pastel.csv";
      link.click();
    }
  </script>
</body>
</html>
