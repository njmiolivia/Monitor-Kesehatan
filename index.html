<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Monitor System</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-badge.connected {
      background-color: #d1fae5;
      color: #065f46;
    }

    .status-badge.simulated {
      background-color: #fef3c7;
      color: #92400e;
    }

    .form-grid {
      display: grid;
      gap: 16px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    input[readonly] {
      background-color: #f8fafc;
      font-weight: 600;
      color: var(--text);
    }

    .btn {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-success {
      background-color: var(--success);
      color: white;
    }

    .btn-success:hover {
      background-color: #059669;
    }

    .btn-warning {
      background-color: var(--warning);
      color: white;
    }

    .btn-warning:hover {
      background-color: #d97706;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background-color: #f1f5f9;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .table-container {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #f1f5f9;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    td {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .empty-row {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-style: italic;
    }

    .table-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h2><i class="fa-solid fa-heart-pulse"></i> Monitoring Kesehatan</h2>
      <span id="statusBadge" class="status-badge">Terputus</span>
    </div>

    <!-- Form Controls -->
    <div class="form-grid">
      <!-- Input Nama & Tombol Bluetooth -->
      <div class="form-group">
        <label for="nama">Nama Pasien / Subjek</label>
        <div class="input-row">
          <input type="text" id="nama" placeholder="Masukkan nama pasien...">
          <button id="btnConnect" class="btn btn-primary" onclick="connectBluetooth()">
            <i class="fa-bluetooth-b fab"></i> Connect
          </button>
        </div>
      </div>

      <!-- Live Sensor Data -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label for="hr"><i class="fa-solid fa-heart" style="color: #ef4444;"></i> Heart Rate (HR)</label>
          <input type="text" id="hr" readonly placeholder="-- BPM">
        </div>

        <div class="form-group">
          <label for="temp"><i class="fa-solid fa-temperature-high" style="color: #f59e0b;"></i> Temperatur</label>
          <input type="text" id="temp" readonly placeholder="-- °C">
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button class="btn btn-success" style="flex: 2;" onclick="saveData()">
          <i class="fa-solid fa-floppy-disk"></i> Save Data
        </button>
        <button id="btnSimulate" class="btn btn-warning" style="flex: 1;" onclick="toggleSimulation()">
          <i class="fa-solid fa-flask"></i> Simulasi Data
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>HR</th>
            <th>Temperature</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr id="emptyRow">
            <td colspan="3" class="empty-row">Belum ada data tersimpan.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Download Button -->
    <div class="table-footer">
      <button class="btn btn-outline" onclick="downloadCSV()">
        <i class="fa-solid fa-file-csv"></i> Download (CSV)
      </button>
    </div>
  </div>

  <script>
    let port;
    let reader;
    let savedRecords = [];
    let isSimulating = false;
    let simInterval = null;

    // 1. KONEKSI BLUETOOTH SERIAL
    async function connectBluetooth() {
      // Matikan simulasi jika sedang berjalan
      if (isSimulating) stopSimulation();

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        updateStatus("Terhubung", "connected");
        document.getElementById('btnConnect').innerText = "Connected";

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();

        readSerialData();
      } catch (error) {
        console.error("Gagal koneksi Bluetooth:", error);
        alert("Gagal koneksi Bluetooth! Menjalankan mode Simulasi Praktikum otomatis.");
        startSimulation();
      }
    }

    // Membaca Data Serial dari ESP32
    async function readSerialData() {
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          reader.releaseLock();
          break;
        }
        if (value) {
          buffer += value;
          let lines = buffer.split("\n");
          buffer = lines.pop();

          for (let line of lines) {
            line = line.trim();
            if (line.length > 0) {
              let parts = line.split(",");
              if (parts.length === 2) {
                updateDisplays(parts[0], parts[1]);
              }
            }
          }
        }
      }
    }

    // 2. SIMULASI DATA ACAK (PRAKTIKUM)
    function toggleSimulation() {
      if (isSimulating) {
        stopSimulation();
      } else {
        startSimulation();
      }
    }

    function startSimulation() {
      isSimulating = true;
      updateStatus("Mode Simulasi", "simulated");
      document.getElementById('btnSimulate').innerHTML = `<i class="fa-solid fa-stop"></i> Stop Simulasi`;

      // Hasilkan data acak setiap 1.5 detik
      simInterval = setInterval(() => {
        // HR acak normal (65 - 95 BPM)
        const randomHR = Math.floor(Math.random() * (95 - 65 + 1)) + 65;
        // Temperatur acak normal (36.1 - 37.4 °C)
        const randomTemp = (Math.random() * (37.4 - 36.1) + 36.1).toFixed(1);

        updateDisplays(randomHR, randomTemp);
      }, 1500);
    }

    function stopSimulation() {
      isSimulating = false;
      clearInterval(simInterval);
      updateStatus("Terputus", "");
      document.getElementById('btnSimulate').innerHTML = `<i class="fa-solid fa-flask"></i> Simulasi Data`;
    }

    // Helper untuk Update Nilai ke Layar
    function updateDisplays(hr, temp) {
      document.getElementById('hr').value = hr + " BPM";
      document.getElementById('temp').value = temp + " °C";
    }

    // Helper Badge Status
    function updateStatus(text, className) {
      const badge = document.getElementById('statusBadge');
      badge.innerText = text;
      badge.className = "status-badge " + className;
    }

    // 3. SIMPAN DATA KE TABEL
    function saveData() {
      const nama = document.getElementById('nama').value.trim();
      const hr = document.getElementById('hr').value;
      const temp = document.getElementById('temp').value;

      if (!nama) {
        alert("Silakan isi Nama terlebih dahulu!");
        return;
      }
      if (!hr || !temp || hr === "-- BPM") {
        alert("Data HR dan Temperatur belum tersedia!");
        return;
      }

      // Hapus baris kosong pada tabel jika ini data pertama
      const emptyRow = document.getElementById('emptyRow');
      if (emptyRow) emptyRow.remove();

      // Simpan ke Array
      savedRecords.push({ nama, hr, temp });

      // Tambahkan baris baru ke tabel
      const tbody = document.getElementById('tableBody');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${nama}</strong></td>
        <td>${hr}</td>
        <td>${temp}</td>
      `;
      tbody.appendChild(row);
    }

    // 4. DOWNLOAD FILE CSV
    function downloadCSV() {
      if (savedRecords.length === 0) {
        alert("Belum ada data tersimpan untuk di-download!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Nama,HR,Temperature\n";
      savedRecords.forEach(r => {
        csvContent += `"${r.nama}","${r.hr}","${r.temp}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Data_Kesehatan_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
